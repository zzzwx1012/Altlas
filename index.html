    const INITIAL_TASKS = [

        title: 'Refactor Session Authorization Middleware',
        title_zh: '重构会话授权中间件结构',
        description: 'Consolidate token verification pipelines, update active sessions check in schema, and write initial validation hooks.',
        description_zh: '整合 Token 验证管道，更新 Schema 中的活动会话检查，并编写初始验证钩子。',

        priority: 'High',

      },
      {
        id: 'task-2',
        title: 'Fix viewport overflow error on checkout viewport',
        title_zh: '修复结账页面移动端视口溢出错误',
        description: 'Mobile keyboards cause checkout CTA containers to render off-canvas on devices running iOS.',
        description_zh: '在运行 iOS 的设备上，移动端键盘会导致结账 CTA 按钮渲染超出画布。',

        priority: 'High',
        status: 'Completed',

        createdAt_zh: '4 小时前'
      }
    ];

    const INITIAL_ACTIVITIES = {
      en: [
        { id: 'act-1', text: 'Task "Fix viewport overflow error..." marked as Completed', time: '1 hour ago' },
        { id: 'act-2', text: 'Status "Refactor Session Authorization..." moved to In Progress', time: '2 hours ago' }
      ],
      zh: [
        { id: 'act-1', text: '任务“修复结账页面移动端视口溢出错误”被标记为已完成', time: '1 小时前' },
        { id: 'act-2', text: '任务“重构会话授权中间件结构”状态变更为进行中', time: '2 小时前' }
      ]
    };

    function App() {
      const [lang, setLang] = useState('zh');
      
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('atlas_tasks');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });

      const [activities, setActivities] = useState(() => {
        const saved = localStorage.getItem('atlas_activities');
        return saved ? JSON.parse(saved) : INITIAL_ACTIVITIES.zh;
      });

      // API Settings State
      const [apiBaseUrl, setApiBaseUrl] = useState(() => localStorage.getItem('atlas_api_url') || 'https://openrouter.ai/api/v1');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('atlas_api_key') || '');
      const [apiModel, setApiModel] = useState(() => localStorage.getItem('atlas_api_model') || 'openrouter/free');
      const [showSettings, setShowSettings] = useState(false);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [filterStatus, setFilterStatus] = useState('All');
      const [showForm, setShowForm] = useState(false);
      const [formTitle, setFormTitle] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [formCat, setFormCat] = useState('Task');
      const [formPri, setFormPri] = useState('Medium');

      const [parserInput, setParserInput] = useState('');
      const [isParsing, setIsParsing] = useState(false);
      const [parsedOutput, setParsedOutput] = useState(null);
      const [parserError, setParserError] = useState('');

      // Photo Curator State
      const [uploadedImages, setUploadedImages] = useState([]);
      const [isAnalyzingPhotos, setIsAnalyzingPhotos] = useState(false);
      const [curationResult, setCurationResult] = useState(() => {
        const saved = localStorage.getItem('atlas_curation');
        return saved ? JSON.parse(saved) : null;
      });
      const [photoError, setPhotoError] = useState('');
      const [isOptimized, setIsOptimized] = useState(false);
      const fileInputRef = useRef(null);

      const t = LOCALES[lang];

      useEffect(() => {
        localStorage.setItem('atlas_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('atlas_activities', JSON.stringify(activities));
      }, [activities]);

      useEffect(() => {
        if (curationResult) {
          localStorage.setItem('atlas_curation', JSON.stringify(curationResult));
        } else {
          localStorage.removeItem('atlas_curation');
        }
      }, [curationResult]);

      const handleSaveSettings = (e) => {
        e.preventDefault();
        localStorage.setItem('atlas_api_url', apiBaseUrl);
        localStorage.setItem('atlas_api_key', apiKey);
        localStorage.setItem('atlas_api_model', apiModel);
        setShowSettings(false);
        logSystemActivity(
          "API Gateway Settings Updated Successfully.",
          "大模型 API 网关配置更新成功。"
        );
      };

      const logSystemActivity = (actionTextEn, actionTextZh) => {
        const text = lang === 'zh' ? actionTextZh : actionTextEn;
        const action = {
          id: 'act-' + Date.now(),
          text,
          time: lang === 'zh' ? '刚刚' : 'Just now'
        };
        setActivities(prev => [action, ...prev.slice(0, 4)]);
      };

      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!formTitle.trim()) return;

        const isChinese = lang === 'zh';
        const newTask = {
          id: 'task-' + Date.now(),
          title: isChinese ? '' : formTitle,
          title_zh: isChinese ? formTitle : '',
          description: isChinese ? '' : (formDesc || 'No details.'),
          description_zh: isChinese ? (formDesc || '暂无详细描述信息。') : '',
          category: formCat,
          priority: formPri,
          status: 'Pending',
          createdAt_en: 'Just now',
          createdAt_zh: '刚刚'
        };

        setTasks(prev => [newTask, ...prev]);
        logSystemActivity(
          `Created task "${formTitle}"`,
          `创建了任务单元 "${formTitle}"`
        );
        
        setFormTitle('');
        setFormDesc('');
        setFormCat('Task');
        setFormPri('Medium');
        setShowForm(false);
      };

      const handleToggleStatus = (id) => {
        setTasks(prev => prev.map(task => {
          if (task.id === id) {
            let nextStatus = 'Pending';
            if (task.status === 'Pending') nextStatus = 'In Progress';
            else if (task.status === 'In Progress') nextStatus = 'Completed';
            
            const currentTitle = lang === 'zh' ? (task.title_zh || task.title) : (task.title || task.title_zh);
            logSystemActivity(
              `Updated "${currentTitle}" status to ${nextStatus}`,
              `更新了 "${currentTitle}" 状态为 [${t[nextStatus] || nextStatus}]`
            );
            return { ...task, status: nextStatus };
          }
          return task;
        }));
      };

      const handleDeleteTask = (id) => {
        const target = tasks.find(task => task.id === id);
        if (target) {
          const currentTitle = lang === 'zh' ? (target.title_zh || target.title) : (target.title || target.title_zh);
          setTasks(prev => prev.filter(task => task.id !== id));
          logSystemActivity(
            `Removed task "${currentTitle}"`,
            `删除了任务单元 "${currentTitle}"`
          );
        }
      };

      // AI Text Parser Call
      const handleRunParser = async () => {
        if (!parserInput.trim()) return;
        if (!apiKey.trim()) {
          setParserError(t.apiNotSet);
          return;
        }

        setIsParsing(true);
        setParsedOutput(null);
        setParserError('');

        const promptTemplate = `
You are a precise task management analyzer. Your job is to extract structured tasks from natural language inputs.
Analyze this input description: "${parserInput}"

You must output STRICTLY a JSON object with this exact shape:
{
  "title": "A short concise title for the task (max 45 characters)",
  "description": "A refined, professional description of the task requirements",
  "category": "Must be strictly one of: 'Task', 'Requirement', or 'Issue'",
  "priority": "Must be strictly one of: 'High', 'Medium', or 'Low'",
  "confidence": <An integer from 50 to 100 representing your prediction certainty>
}

Rules: Output ONLY raw JSON string. Do not wrap in markdown \`\`\`json.
`;

        try {
          const response = await fetch(`${apiBaseUrl}/chat/completions`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: apiModel,
              messages: [
                { role: 'user', content: promptTemplate }
              ],
              temperature: 0.2
            })
          });

          if (!response.ok) {
            throw new Error(`HTTP Error: ${response.status}`);
          }

          const responseData = await response.json();
          let completionText = responseData.choices[0].message.content.trim();

          if (completionText.startsWith("```")) {
            completionText = completionText.replace(/^```json/, "").replace(/^```/, "").replace(/```$/, "").trim();
          }

          const result = JSON.parse(completionText);
          
          setParsedOutput({
            title: result.title || 'Parsed Task Unit',
            description: result.description || parserInput,
            category: ['Task', 'Requirement', 'Issue'].includes(result.category) ? result.category : 'Task',
            priority: ['High', 'Medium', 'Low'].includes(result.priority) ? result.priority : 'Medium',
            confidence: result.confidence || 85
          });

        } catch (error) {
          console.error(error);
          setParserError(t.apiErrorMsg);
        } finally {
          setIsParsing(false);
        }
      };

      const handleConfirmParsedTask = () => {
        if (!parsedOutput) return;

        const isChinese = lang === 'zh';
        const committedTask = {
          id: 'task-' + Date.now(),
          title: isChinese ? '' : parsedOutput.title,
          title_zh: isChinese ? parsedOutput.title : '',
          description: isChinese ? '' : parsedOutput.description,
          description_zh: isChinese ? parsedOutput.description : '',
          category: parsedOutput.category,
          priority: parsedOutput.priority,
          status: 'Pending',
          createdAt_en: 'Just now',
          createdAt_zh: '刚刚'
        };

        setTasks(prev => [committedTask, ...prev]);
        logSystemActivity(
          `Imported AI parsed task "${parsedOutput.title}"`,
          `从 AI 提取导入了新任务 "${parsedOutput.title}"`
        );
        
        setParserInput('');
        setParsedOutput(null);
        setActiveTab('tasks');
      };

      // AI PHOTO CURATOR - Base64 Conversion & Multi-modal request
      const handlePhotoUpload = (e) => {
        const files = Array.from(e.target.files);
        if (files.length < 1) return;

        setPhotoError('');
        const readers = files.map(file => {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => {
              resolve({
                name: file.name,
                url: reader.result, // base64 encoding DataURI
                base64: reader.result
              });
            };
            reader.readAsDataURL(file);
          });
        });

        Promise.all(readers).then(results => {
          setUploadedImages(prev => [...prev, ...results].slice(0, 9)); // Limits maximum file strip to 9
        });
      };

      const handleRunCuration = async () => {
        if (uploadedImages.length < 2) {
          setPhotoError(lang === 'zh' ? '请至少上传两张照片以开启 AI 策展比对。' : 'Please upload at least 2 photos to compare and curate.');
          return;
        }
        if (!apiKey.trim()) {
          setPhotoError(t.apiNotSet);
          return;
        }

        setIsAnalyzingPhotos(true);
        setPhotoError('');
        setCurationResult(null);

        // Standard OpenAI Multi-modal Request structure compliant with OpenRouter
        const imageContentBlock = uploadedImages.map((img) => ({
          type: "image_url",
          image_url: { url: img.base64 }
        }));

        const textInstruction = {
          type: "text",
          text: `You are an elite photography curator and professional darkroom retoucher.
Analyze these ${uploadedImages.length} uploaded photos. Compare them carefully, focusing heavily on portrait aesthetics (expression, posing, lighting, composition) if there are people.

Pick the single best photo from the batch (identify it by its 0-based order index in the input array).
Evaluate this chosen best photo across 5 dimensions on a scale of 0 to 100:
1. Composition (framing)
2. Lighting (exposure, shadows)
3. Color (tonal harmony)
4. Vibe (atmospheric emotion)
5. Portrait (facial expression, pose, capture of emotion)

Then, configure digital "Darkroom" CSS filter settings to optimize this selected photo (make subtle, elegant adjustments like slightly raising contrast, adding subtle warmth, grayscale, or saturation adjustments).

You MUST respond strictly with a raw JSON string of this exact shape:
{
  "selectedIndex": <0-based index of the chosen best image, must be integer between 0 and ${uploadedImages.length - 1}>,
  "title": "A short, elegant magazine cover title for this image",
  "review": "A detailed editor-in-chief critique (in ${lang === 'zh' ? 'Chinese' : 'English'}) explaining exactly why this image is the masterpiece of the batch.",
  "scores": {
    "composition": <integer 0-100>,
    "lighting": <integer 0-100>,
    "color": <integer 0-100>,
    "vibe": <integer 0-100>,
    "portrait": <integer 0-100>
  },
  "darkroom": {
    "brightness": <float value between 0.7 and 1.3, default 1.0>,
    "contrast": <float value between 0.7 and 1.3, default 1.0>,
    "saturate": <float value between 0.7 and 1.3, default 1.0>,
    "sepia": <float value between 0.0 and 0.5, default 0.0>,
    "grayscale": <float value between 0.0 and 1.0, default 0.0>
  }
}

Do not write any backticks, explanation, or markdown wrappers. Only output valid JSON.`
        };

        try {
          const response = await fetch(`${apiBaseUrl}/chat/completions`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: apiModel,
              messages: [
                {
                  role: "user",
                  content: [textInstruction, ...imageContentBlock]
                }
              ],
              temperature: 0.3
            })
          });

          if (!response.ok) {
            throw new Error(`HTTP Error: ${response.status}`);
          }

          const responseData = await response.json();
          let completionText = responseData.choices[0].message.content.trim();

          if (completionText.startsWith("```")) {
            completionText = completionText.replace(/^```json/, "").replace(/^```/, "").replace(/```$/, "").trim();
          }

          const result = JSON.parse(completionText);
          
          // Save standard details
          result.localBlobUrl = uploadedImages[result.selectedIndex].url;
          result.base64 = uploadedImages[result.selectedIndex].base64;
          result.originalFilename = uploadedImages[result.selectedIndex].name;

          setCurationResult(result);
          setIsOptimized(true);

          logSystemActivity(
            `Aesthetic curation completed for image "${result.title}".`,
            `视觉相册策展成功，甄选出封面影像 "${result.title}"。`
          );

          console.error(error);

          canvas.height = img.naturalHeight;

            ctx.filter = `brightness(${d.brightness || 1}) contrast(${d.contrast || 1}) saturate(${d.saturate || 1}) sepia(${d.sepia || 0}) grayscale(${d.grayscale || 0})`;
            ctx.drawImage(img, 0, 0);

            const link = document.createElement('a');
            link.download = `optimized_${curationResult.originalFilename || 'curated_photo.jpg'}`;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
          }
        };

                            <span class="flex items-center space-x-2">
                              <svg class="animate-spin h-3 w-3 text-white" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                              </svg>
                              <span>{t.analyzing}</span>
                            </span>
                          ) : t.analyzeBtn}
                        </button>
                      </div>
                    </div>

                    <div class="bg-white border border-gray-200 p-5">
                      <span class="text-[9px] font-mono uppercase tracking-wider text-gray-400 block mb-3">{t.examplesTitle}</span>
                      <div class="space-y-2">
                        {[t.preset1, t.preset2, t.preset3].map((promptText, idx) => (
                          <button 
                            key={idx}
                            onClick={() => setParserInput(promptText)}
                            class="w-full text-left text-xs font-mono text-gray-500 hover:text-[#2563EB] hover:bg-gray-50 p-2.5 border border-dashed border-gray-200 transition-colors flex items-center justify-between">
                            <span class="truncate pr-4">"{promptText}"</span>
                            <span class="text-[8px] text-gray-400 uppercase font-bold shrink-0">Load ↵</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div class="lg:col-span-5">
                    {parsedOutput ? (
                      <div class="bg-white border-2 border-[#2563EB] p-6 animate-fadeIn">
                        <div class="flex items-center justify-between pb-3 border-b border-gray-100 mb-4">
                          <span class="text-[10px] font-mono uppercase tracking-wider text-[#2563EB] font-bold">{t.extractionProfile}</span>
                          <span class="text-[9px] font-mono text-gray-500 bg-blue-50 px-2 py-0.5 border border-blue-100">
                            {t.confidence}: {parsedOutput.confidence}%
                          </span>
                        </div>

                        <div class="space-y-4">
                          <div>
                            <label class="block text-[9px] font-mono uppercase tracking-wider text-gray-400 mb-1">{t.extractedTitle}</label>
                            <input 
                              type="text" 
                              value={parsedOutput.title}
                              onChange={(e) => setParsedOutput({ ...parsedOutput, title: e.target.value })}
                              class="w-full text-xs font-semibold border border-gray-200 px-3 py-2 bg-gray-50 focus:border-[#2563EB] focus:bg-white"
                            />
                          </div>

                          <div class="grid grid-cols-2 gap-3">
                            <div>
                              <label class="block text-[9px] font-mono uppercase tracking-wider text-gray-400 mb-1">{t.categoryCode}</label>
                              <select 
                                value={parsedOutput.category}
                                onChange={(e) => setParsedOutput({ ...parsedOutput, category: e.target.value })}
                                class="w-full text-xs border border-gray-200 px-2 py-2 bg-gray-50 focus:border-[#2563EB] focus:bg-white font-mono">
                                <option value="Task">{t.Task}</option>
                                <option value="Requirement">{t.Requirement}</option>
                                <option value="Issue">{t.Issue}</option>
                              </select>
                            </div>
                            <div>
                              <label class="block text-[9px] font-mono uppercase tracking-wider text-gray-400 mb-1">{t.priorityRank}</label>
                              <select 
                                value={parsedOutput.priority}
                                onChange={(e) => setParsedOutput({ ...parsedOutput, priority: e.target.value })}
                                class="w-full text-xs border border-gray-200 px-2 py-2 bg-gray-50 focus:border-[#2563EB] focus:bg-white font-mono">
                                <option value="High">{t.High}</option>
                                <option value="Medium">{t.Medium}</option>
                                <option value="Low">{t.Low}</option>
                              </select>
                            </div>
                          </div>

                          <div>
                            <label class="block text-[9px] font-mono uppercase tracking-wider text-gray-400 mb-1">{t.analyzedScope}</label>
                            <textarea 
                              rows="3"
                              value={parsedOutput.description}
                              onChange={(e) => setParsedOutput({ ...parsedOutput, description: e.target.value })}
                              class="w-full text-xs border border-gray-200 px-3 py-2 bg-gray-50 focus:border-[#2563EB] focus:bg-white leading-relaxed"
                            />
                          </div>

                          <button 
                            type="button"
                            onClick={handleConfirmParsedTask}
                            class="w-full bg-[#2563EB] text-white text-[10px] font-mono uppercase tracking-wider py-3 hover:bg-blue-700 transition-colors mt-4">
                            {t.pushToRegistry}
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div class="h-full min-h-[280px] border border-dashed border-gray-200 flex flex-col justify-center items-center text-center p-6 bg-gray-50">
                        <svg class="w-6 h-6 text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                        </svg>
                        <span class="text-[9px] font-mono text-gray-400 uppercase tracking-widest font-bold">{t.awaitingPrompt}</span>
                        <p class="text-[10px] text-gray-400 max-w-xs mt-1.5 leading-relaxed">{t.awaitingPromptDesc}</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* MODULE 4: AI Photo Curator */}
            {activeTab === 'curator' && (
              <div class="animate-fadeIn">
                <div class="mb-10">
                  <div class="text-[9px] font-mono uppercase tracking-[0.3em] text-gray-400 mb-1 font-semibold">{t.curatorSubtitle}</div>
                  <h1 class="text-2xl font-bold tracking-tight text-[#111827]">{t.curatorTitle}</h1>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                  {/* Left Column: Negative Strip upload & Image strip */}
                  <div class="lg:col-span-7 space-y-4">
                    
                    {/* Drag and Drop Zone */}
                    <div 
                      onClick={() => fileInputRef.current.click()}
                      class="border-2 border-dashed border-gray-200 bg-white p-8 text-center cursor-pointer hover:border-[#2563EB] transition-colors flex flex-col items-center">
                      <svg class="w-8 h-8 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                      </svg>
                      <span class="text-xs font-mono text-[#111827] uppercase tracking-wider">{t.uploadArea}</span>
                      <span class="text-[10px] text-gray-400 mt-1">{t.uploadTip}</span>
                      <input 
                        type="file" 
                        multiple 
                        accept="image/*"
                        ref={fileInputRef}
                        onChange={handlePhotoUpload}
                        class="hidden"
                      />
                    </div>

                    {photoError && (
                      <div class="p-3 bg-red-50 border border-red-200 text-red-600 font-mono text-[10px] leading-relaxed">
                        ⚠️ {photoError}
                      </div>
                    )}

                    {/* Image Negatives strip layout */}
                    {uploadedImages.length > 0 && (
                      <div class="bg-white border border-gray-200 p-5">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
                          <h3 class="text-[10px] font-mono uppercase tracking-widest text-gray-500">{t.selectedPhotos} ({uploadedImages.length}/9)</h3>
                          <button 
                            onClick={() => { setUploadedImages([]); setCurationResult(null); }}
                            class="text-[9px] font-mono uppercase text-red-500 hover:text-red-700">
                            [- Clear All]
                          </button>
                        </div>

                        <div class="grid grid-cols-3 gap-3">
                          {uploadedImages.map((img, idx) => (
                            <div key={idx} class="relative group aspect-square border border-gray-200 overflow-hidden bg-gray-50">
                              <img src={img.url} alt={`Negative ${idx}`} class="w-full h-full object-cover" />
                              <span class="absolute bottom-1 left-1 bg-black text-white font-mono text-[8px] px-1 py-0.5">
                                #{idx + 1}
                              </span>
                              <button 
                                onClick={(e) => {
                                  e.stopPropagation();
                                  setUploadedImages(prev => prev.filter((_, i) => i !== idx));
                                }}
                                class="absolute top-1 right-1 bg-red-600 text-white text-[8px] font-mono px-1 py-0.5 opacity-0 group-hover:opacity-100 transition-opacity">
                                X
                              </button>
                            </div>
                          ))}
                        </div>

                        <div class="mt-5 flex justify-end">
                          <button 
                            onClick={handleRunCuration}
                            disabled={isAnalyzingPhotos || uploadedImages.length < 2}
                            class={`font-mono uppercase tracking-wider text-[10px] px-6 py-2.5 transition-colors ${
                              uploadedImages.length < 2 ? 'bg-gray-100 text-gray-400 cursor-not-allowed border' : 'bg-[#2563EB] text-white hover:bg-blue-700'
                            }`}>
                            {isAnalyzingPhotos ? t.analyzingPhotos : t.analyzePhotosBtn}
                          </button>
                        </div>
                      </div>
                    )}

                  </div>

                  {/* Right Column: Dynamic Curation Showcase & Darkroom controller */}
                  <div class="lg:col-span-5">
                    {curationResult ? (
                      <div class="space-y-6">
                        
                        {/* Selected Cover Banner Layout */}
                        <div class="bg-white border-2 border-[#111827] p-6 animate-fadeIn">
                          <div class="flex items-center justify-between pb-3 border-b border-gray-100 mb-4">
                            <span class="text-[10px] font-mono uppercase tracking-wider text-[#2563EB] font-bold">{t.curatedShowcase}</span>
                            <span class="text-[9px] font-mono text-gray-500 bg-gray-50 px-2 py-0.5 border border-gray-200">
                              {t.curationIndex} #{curationResult.selectedIndex + 1}
                            </span>
                          </div>

                          {/* Image Box with CSS Filter live-rendering */}
                          <div class="relative overflow-hidden aspect-[3/4] border border-gray-200 mb-4 bg-gray-100">
                            <img 
                              src={curationResult.localBlobUrl || curationResult.base64} 
                              alt="Master Match"
                              style={{ filter: getFilterStyle() }}
                              class="w-full h-full object-cover transition-all duration-300"
                            />
                            
                            {/* Magazine style overlay text */}
                            <div class="absolute inset-0 p-6 flex flex-col justify-between bg-gradient-to-t from-black/60 via-transparent to-transparent">
                              <span class="text-white/80 font-mono text-[9px] tracking-[0.3em] uppercase">ATLAS CURATION EDITION</span>
                              <div>
                                <h2 class="text-white text-lg font-bold font-sans tracking-tight uppercase leading-tight">{curationResult.title}</h2>
                                <span class="text-white/60 font-mono text-[8px] tracking-wider block mt-1">FILE: {curationResult.originalFilename}</span>
                              </div>
                            </div>
                          </div>

                          {/* Original vs Optimized Switcher Control */}
                          <div class="bg-gray-50 border border-gray-200 p-3.5 flex justify-between items-center mb-6">
                            <span class="text-[10px] font-mono uppercase text-gray-500">{t.darkroomTitle}</span>
                            <div class="flex items-center space-x-1.5 border border-gray-200 p-0.5 bg-white">
                              <button 
                                onClick={() => setIsOptimized(false)}
                                class={`text-[8px] font-mono px-2 py-1 uppercase ${!isOptimized ? 'bg-[#111827] text-white' : 'text-gray-500 hover:text-[#111827]'}`}>
                                {t.originalLabel}
                              </button>
                              <button 
                                onClick={() => setIsOptimized(true)}
                                class={`text-[8px] font-mono px-2 py-1 uppercase ${isOptimized ? 'bg-[#2563EB] text-white' : 'text-gray-500 hover:text-[#2563EB]'}`}>
                                {t.optimizedLabel}
                              </button>
                            </div>
                          </div>

                          {/* Curatorial aesthetic metrics */}
                          <div class="space-y-3.5 mb-6">
                            {[
                              { label: t.scoreComposition, val: curationResult.scores?.composition },
                              { label: t.scoreLighting, val: curationResult.scores?.lighting },
                              { label: t.scoreColor, val: curationResult.scores?.color },
                              { label: t.scoreVibe, val: curationResult.scores?.vibe },
                              { label: t.scorePortrait, val: curationResult.scores?.portrait }
                            ].map((item, idx) => (
                              <div key={idx} class="space-y-1">
                                <div class="flex justify-between text-[10px] font-mono">
                                  <span class="text-gray-500 uppercase">{item.label}</span>
                                  <span class="text-[#111827] font-bold">{item.val}/100</span>
                                </div>
                                <div class="w-full bg-gray-100 h-1">
                                  <div class="bg-[#111827] h-1" style={{ width: `${item.val || 0}%` }}></div>
                                </div>
                              </div>
                            ))}
                          </div>

                          {/* Editor Editorial Review Critique block */}
                          <div class="border-t border-gray-100 pt-4">
                            <h4 class="text-[10px] font-mono uppercase tracking-widest text-gray-400 mb-2">{t.editorReview}</h4>
                            <p class="text-xs text-gray-600 leading-relaxed italic">
                              "{curationResult.review}"
                            </p>
                          </div>

                          {/* Export HD optimized copy */}
                          <button 
                            onClick={handleDownloadOptimized}
                            class="w-full mt-6 bg-[#111827] text-white text-[10px] font-mono uppercase tracking-wider py-3 hover:bg-gray-800 transition-colors flex items-center justify-center space-x-1.5">
                            <span>{t.downloadBtn}</span>
                          </button>

                        </div>

                      </div>
                    ) : (
                      <div class="h-full min-h-[350px] border border-dashed border-gray-200 flex flex-col justify-center items-center text-center p-6 bg-gray-50">
                        <svg class="w-6 h-6 text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                        </svg>
                        <span class="text-[9px] font-mono text-gray-400 uppercase tracking-widest font-bold">{t.awaitingPrompt}</span>
                        <p class="text-[10px] text-gray-400 max-w-xs mt-1.5 leading-relaxed">{t.awaitingPromptDesc}</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* API settings popup module */}
            {showSettings && (
              <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div class="bg-white border-2 border-black w-full max-w-md p-6 animate-fadeIn">
                  <div class="flex justify-between items-start pb-4 border-b border-gray-100 mb-5">
                    <div>
                      <h2 class="text-sm font-bold text-[#111827] font-mono uppercase tracking-wide">{t.settingsTitle}</h2>
                      <p class="text-[10px] text-gray-400 mt-0.5">{t.settingsSub}</p>
                    </div>
                    <button onClick={() => setShowSettings(false)} class="text-gray-400 hover:text-black text-sm font-mono p-1">[X]</button>
                  </div>

                  <form onSubmit={handleSaveSettings} class="space-y-4">
                    <div>
                      <label class="block text-[9px] font-mono uppercase tracking-wider text-gray-500 mb-1">{t.baseUrlLabel}</label>
                      <input 
                        type="url" required value={apiBaseUrl} onChange={(e) => setApiBaseUrl(e.target.value)}
                        placeholder="https://openrouter.ai/api/v1"
                        class="w-full text-xs border border-gray-200 px-3 py-2 bg-gray-50 focus:border-[#2563EB] focus:bg-white font-mono"
                      />
                    </div>

                    <div>
                      <label class="block text-[9px] font-mono uppercase tracking-wider text-gray-500 mb-1">{t.keyLabel}</label>
                      <input 
                        type="password" required value={apiKey} onChange={(e) => setApiKey(e.target.value)}
                        placeholder="sk-........................"
                        class="w-full text-xs border border-gray-200 px-3 py-2 bg-gray-50 focus:border-[#2563EB] focus:bg-white font-mono"
                      />
                    </div>

                    <div>
                      <label class="block text-[9px] font-mono uppercase tracking-wider text-gray-500 mb-1">{t.modelLabel}</label>
                      <input 
                        type="text" required value={apiModel} onChange={(e) => setApiModel(e.target.value)}
                        placeholder="openrouter/free"
                        class="w-full text-xs border border-gray-200 px-3 py-2 bg-gray-50 focus:border-[#2563EB] focus:bg-white font-mono"
                      />
                    </div>

                    <div class="pt-2 border-t border-gray-100">
                      <span class="block text-[8px] font-mono text-gray-400 uppercase tracking-widest mb-2">Preset Gateways</span>
                      <div class="flex gap-2">
                        <button 
                          type="button"
                          onClick={() => { setApiBaseUrl('https://openrouter.ai/api/v1'); setApiModel('google/gemini-2.5-flash'); }}
                          class="text-[9px] font-mono border border-gray-200 px-2.5 py-1 hover:bg-gray-50 transition-colors">
                          Gemini 2.5
                        </button>
                        <button 
                          type="button"
                          onClick={() => { setApiBaseUrl('https://openrouter.ai/api/v1'); setApiModel('meta-llama/llama-3.2-11b-vision-instruct'); }}
                          class="text-[9px] font-mono border border-gray-200 px-2.5 py-1 hover:bg-gray-50 transition-colors">
                          Llama 3.2 Vision
                        </button>
                        <button 
                          type="button"
                          onClick={() => { setApiBaseUrl('https://openrouter.ai/api/v1'); setApiModel('openrouter/free'); }}
                          class="text-[9px] font-mono border border-gray-200 px-2.5 py-1 hover:bg-gray-50 transition-colors">
                          Free Auto-Router
                        </button>
                      </div>
                    </div>

                    <div class="flex justify-end pt-4 border-t border-gray-100 space-x-2">
                      <button type="button" onClick={() => setShowSettings(false)} class="text-[9px] font-mono uppercase px-3 py-2 text-gray-400 hover:text-gray-900">{t.cancel}</button>
                      <button type="submit" class="bg-[#2563EB] text-white text-[9px] font-mono uppercase px-4 py-2 hover:bg-blue-700 transition-colors">{t.saveBtn}</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
