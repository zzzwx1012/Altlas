    const INITIAL_TASKS = [

        title: 'Refactor Session Authorization Middleware',

      {

        title_zh: '修复结账页面移动端视口溢出错误',
        description: 'Mobile keyboards cause checkout CTA containers to render off-canvas on devices running iOS.',
        description_zh: '在运行 iOS 的设备上，移动端键盘会导致结账 CTA 按钮渲染超出画布。',
        category: 'Issue',
        priority: 'High',
        status: 'Completed',
        createdAt_en: '4 hours ago',
        createdAt_zh: '4 小时前'
      },
      {
        id: 'task-3',
        title: 'Draft standard API specifications v2.4',
        title_zh: '起草标准 API 规范 v2.4 核心大纲',
        description: 'Document endpoints, security payloads, and custom response schemes in formatting document.',
        description_zh: '在格式化文档中记录端点、安全负载和自定义响应方案。',
        category: 'Task',
        priority: 'Medium',
        status: 'Pending',
        createdAt_en: '1 day ago',
        createdAt_zh: '1 天前'
      }
    ];

    const INITIAL_ACTIVITIES = {
      en: [
        { id: 'act-1', text: 'Task "Fix viewport overflow error..." marked as Completed', time: '1 hour ago' },
        { id: 'act-2', text: 'Status "Refactor Session Authorization..." moved to In Progress', time: '2 hours ago' },
        { id: 'act-3', text: 'Registered configuration element "Draft standard API..."', time: '1 day ago' }
      ],
      zh: [
        { id: 'act-1', text: '任务“修复结账页面移动端视口溢出错误”被标记为已完成', time: '1 小时前' },
        { id: 'act-2', text: '任务“重构会话授权中间件结构”状态变更为进行中', time: '2 小时前' },
        { id: 'act-3', text: '已创建新的系统任务“起草标准 API 规范 v2.4 核心大纲”', time: '1 天前' }
      ]
    };

    function App() {
      const [lang, setLang] = useState('zh');
      
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('atlas_tasks');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });

      const [activities, setActivities] = useState(() => {
        const saved = localStorage.getItem('atlas_activities');
        return saved ? JSON.parse(saved) : INITIAL_ACTIVITIES.zh;
      });

      // API Settings State
      const [apiBaseUrl, setApiBaseUrl] = useState(() => localStorage.getItem('atlas_api_url') || 'https://api.deepseek.com/v1');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('atlas_api_key') || '');
      const [apiModel, setApiModel] = useState(() => localStorage.getItem('atlas_api_model') || 'deepseek-chat');
      const [showSettings, setShowSettings] = useState(false);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [filterStatus, setFilterStatus] = useState('All');
      const [showForm, setShowForm] = useState(false);
      const [formTitle, setFormTitle] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [formCat, setFormCat] = useState('Task');
      const [formPri, setFormPri] = useState('Medium');

      const [parserInput, setParserInput] = useState('');
      const [isParsing, setIsParsing] = useState(false);
      const [parsedOutput, setParsedOutput] = useState(null);
      const [parserError, setParserError] = useState('');

      const t = LOCALES[lang];

      useEffect(() => {
        localStorage.setItem('atlas_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('atlas_activities', JSON.stringify(activities));
      }, [activities]);

      // Save API configuration to local storage
      const handleSaveSettings = (e) => {
        e.preventDefault();
        localStorage.setItem('atlas_api_url', apiBaseUrl);
        localStorage.setItem('atlas_api_key', apiKey);
        localStorage.setItem('atlas_api_model', apiModel);
        setShowSettings(false);
        logSystemActivity(
          "API Gateway Settings Updated Successfully.",
          "大模型 API 网关配置更新成功。"
        );
      };

      const logSystemActivity = (actionTextEn, actionTextZh) => {
        const text = lang === 'zh' ? actionTextZh : actionTextEn;
        const action = {
          id: 'act-' + Date.now(),
          text,
          time: lang === 'zh' ? '刚刚' : 'Just now'
        };
        setActivities(prev => [action, ...prev.slice(0, 4)]);
      };

      const handleCreateTask = (e) => {
        e.preventDefault();
        if (!formTitle.trim()) return;

        const isChinese = lang === 'zh';
        const newTask = {
          id: 'task-' + Date.now(),
          title: isChinese ? '' : formTitle,
          title_zh: isChinese ? formTitle : '',
          description: isChinese ? '' : (formDesc || 'No details.'),
          description_zh: isChinese ? (formDesc || '暂无详细描述信息。') : '',
          category: formCat,
          priority: formPri,
          status: 'Pending',
          createdAt_en: 'Just now',
          createdAt_zh: '刚刚'
        };

        setTasks(prev => [newTask, ...prev]);
        logSystemActivity(
          `Created task "${formTitle}"`,
          `创建了任务单元 "${formTitle}"`
        );
        
        setFormTitle('');
        setFormDesc('');
        setFormCat('Task');
        setFormPri('Medium');
        setShowForm(false);
      };

      const handleToggleStatus = (id) => {
        setTasks(prev => prev.map(task => {
          if (task.id === id) {
            let nextStatus = 'Pending';
            if (task.status === 'Pending') nextStatus = 'In Progress';
            else if (task.status === 'In Progress') nextStatus = 'Completed';
            
            const currentTitle = lang === 'zh' ? (task.title_zh || task.title) : (task.title || task.title_zh);
            logSystemActivity(
              `Updated "${currentTitle}" status to ${nextStatus}`,
              `更新了 "${currentTitle}" 状态为 [${t[nextStatus] || nextStatus}]`
            );
            return { ...task, status: nextStatus };
          }
          return task;
        }));
      };

      const handleDeleteTask = (id) => {
        const target = tasks.find(task => task.id === id);
        if (target) {
          const currentTitle = lang === 'zh' ? (target.title_zh || target.title) : (target.title || target.title_zh);
          setTasks(prev => prev.filter(task => task.id !== id));
          logSystemActivity(
            `Removed task "${currentTitle}"`,
            `删除了任务单元 "${currentTitle}"`
          );
        }
      };

      // Real LLM API Request Call (OpenAI Protocol Compliant)
      const handleRunParser = async () => {
        if (!parserInput.trim()) return;
        
        if (!apiKey.trim()) {
          setParserError(t.apiNotSet);
          return;
        }

        setIsParsing(true);
        setParsedOutput(null);
        setParserError('');

        const promptTemplate = `
You are a precise task management analyzer. Your job is to extract structured tasks from natural language inputs.
Analyze this input description: "${parserInput}"

You must output STRICTLY a JSON object with this exact shape:
{
  "title": "A short concise title for the task (max 45 characters)",
  "description": "A refined, professional description of the task requirements",
  "category": "Must be strictly one of: 'Task', 'Requirement', or 'Issue'",
  "priority": "Must be strictly one of: 'High', 'Medium', or 'Low'",
  "confidence": <An integer from 50 to 100 representing your prediction certainty>
}

Rules:
1. Do not output any thinking processes, markdowns, or backticks.
2. Output ONLY the raw JSON string. Do not wrap in \`\`\`json.
3. The output must be valid JSON parseable directly.
`;

        try {
          const response = await fetch(`${apiBaseUrl}/chat/completions`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: apiModel,
              messages: [
                { role: 'user', content: promptTemplate }
              ],
              temperature: 0.2
            })
          });

          if (!response.ok) {
            throw new Error(`HTTP Error: ${response.status}`);
          }

          const responseData = await response.json();
          let completionText = responseData.choices[0].message.content.trim();

          // Robust cleanup if model ignores constraints and returns markdown block anyway
          if (completionText.startsWith("```")) {
            completionText = completionText.replace(/^```json/, "").replace(/^```/, "").replace(/```$/, "").trim();
          }

          const result = JSON.parse(completionText);
          
          setParsedOutput({
            title: result.title || 'Parsed Task Unit',
            description: result.description || parserInput,
            category: ['Task', 'Requirement', 'Issue'].includes(result.category) ? result.category : 'Task',
            priority: ['High', 'Medium', 'Low'].includes(result.priority) ? result.priority : 'Medium',
            confidence: result.confidence || 85
          });

        } catch (error) {
          console.error("API Fetch Error:", error);
          setParserError(t.apiErrorMsg);
        } finally {
          setIsParsing(false);
        }
      };

      const handleConfirmParsedTask = () => {
        if (!parsedOutput) return;

        const isChinese = lang === 'zh';
        const committedTask = {
          id: 'task-' + Date.now(),
          title: isChinese ? '' : parsedOutput.title,
          title_zh: isChinese ? parsedOutput.title : '',
          description: isChinese ? '' : parsedOutput.description,
          description_zh: isChinese ? parsedOutput.description : '',
          category: parsedOutput.category,
          priority: parsedOutput.priority,
          status: 'Pending',
          createdAt_en: 'Just now',
          createdAt_zh: '刚刚'
        };

        setTasks(prev => [committedTask, ...prev]);
        logSystemActivity(
          `Imported AI parsed task "${parsedOutput.title}"`,
          `从 AI 提取导入了新任务 "${parsedOutput.title}"`
        );
        
        setParserInput('');
        setParsedOutput(null);
        setActiveTab('tasks');
      };

      const totalCount = tasks.length;
      const inProgressCount = tasks.filter(t => t.status === 'In Progress').length;
      const pendingCount = tasks.filter(t => t.status === 'Pending').length;
      const completedCount = tasks.filter(t => t.status === 'Completed').length;
      const completionRate = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

      const categoryCounts = tasks.reduce((acc, task) => {
        acc[task.category] = (acc[task.category] || 0) + 1;
        return acc;
      }, { Task: 0, Requirement: 0, Issue: 0 });

      const priorityCounts = tasks.reduce((acc, task) => {
        acc[task.priority] = (acc[task.priority] || 0) + 1;
        return acc;
      }, { High: 0, Medium: 0, Low: 0 });

      return (
        <div class="flex flex-col md:flex-row min-h-screen">
          
          {/* Side Navbar */}
          <aside class="md:w-64 bg-white border-b md:border-b-0 md:border-r border-gray-200 p-6 flex flex-col justify-between md:h-screen md:sticky md:top-0 z-30">
            <div>
              <div class="flex items-center justify-between pb-6 border-b border-gray-100">
                <div class="flex items-center space-x-2">
                  <div class="w-3 h-3 bg-[#2563EB]"></div>
                  <span class="font-mono text-[11px] tracking-[0.25em] font-bold text-[#111827]">{t.brand}</span>
                </div>
                <button 
                  onClick={() => setLang(lang === 'en' ? 'zh' : 'en')}
                  class="text-[9px] font-mono border border-gray-300 px-1.5 py-0.5 hover:bg-gray-50 text-gray-500 hover:text-black transition-colors">
                  {lang === 'en' ? '中文' : 'EN'}
                </button>
              </div>

              <nav class="mt-8 space-y-1">
                <button 
                  onClick={() => setActiveTab('dashboard')}
                  class={`w-full flex items-center justify-between px-3 py-2 text-[10px] font-mono uppercase tracking-wider transition-colors ${activeTab === 'dashboard' ? 'bg-[#2563EB] text-white font-medium' : 'text-gray-500 hover:text-[#111827] hover:bg-gray-50'}`}>
                  <span>{t.overview}</span>
                  <span>↗</span>
                </button>
                <button 
                  onClick={() => setActiveTab('tasks')}
                  class={`w-full flex items-center justify-between px-3 py-2 text-[10px] font-mono uppercase tracking-wider transition-colors ${activeTab === 'tasks' ? 'bg-[#2563EB] text-white font-medium' : 'text-gray-500 hover:text-[#111827] hover:bg-gray-50'}`}>
                  <span>{t.repository}</span>
                  <span>{totalCount}</span>
                </button>
                <button 
                  onClick={() => setActiveTab('parser')}
                  class={`w-full flex items-center justify-between px-3 py-2 text-[10px] font-mono uppercase tracking-wider transition-colors ${activeTab === 'parser' ? 'bg-[#2563EB] text-white font-medium' : 'text-gray-500 hover:text-[#111827] hover:bg-gray-50'}`}>
                  <span>{t.aiParser}</span>
                  <span>⚡</span>
                </button>
              </nav>
            </div>

            <div class="pt-6 border-t border-gray-100 space-y-3">
              {/* Gear settings control trigger */}
              <button 
                onClick={() => setShowSettings(true)}
                class="w-full flex items-center space-x-2 text-gray-500 hover:text-black text-[10px] font-mono uppercase tracking-wider py-1 hover:bg-gray-50 px-2 transition-colors">
                <span>⚙️</span>
                <span>{lang === 'zh' ? 'API 接口配置' : 'API Gateway Configuration'}</span>
              </button>

              <div class="hidden md:block">
                <div class="text-[9px] font-mono text-gray-400 uppercase tracking-widest">{t.netProtocol}</div>
                <div class="text-[9px] font-mono text-gray-400 uppercase tracking-widest mt-0.5">{t.platform}</div>
              </div>
            </div>
          </aside>

          {/* Main Workspace Frame */}
          <main class="flex-1 p-6 md:p-12 max-w-5xl w-full mx-auto">
            
            {/* MODULE 1: Dashboard */}
            {activeTab === 'dashboard' && (
              <div class="animate-fadeIn">
                <div class="mb-10">
                  <div class="text-[9px] font-mono uppercase tracking-[0.3em] text-gray-400 mb-1">{t.dashboardSubtitle}</div>
                  <h1 class="text-2xl font-bold tracking-tight text-[#111827]">{t.dashboardTitle}</h1>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                  <div class="bg-white border border-gray-200 p-6">
                    <span class="text-[9px] font-mono uppercase tracking-wider text-gray-400 block mb-3">{t.totalTasks}</span>
                    <span class="text-4xl font-mono font-light text-[#111827]">{totalCount}</span>
                  </div>
                  <div class="bg-white border border-gray-200 p-6">
                    <span class="text-[9px] font-mono uppercase tracking-wider text-gray-400 block mb-3">{t.inProgress}</span>
                    <span class="text-4xl font-mono font-light text-[#111827]">{inProgressCount}</span>
                  </div>
                  <div class="bg-white border border-gray-200 p-6">

                        type="button" 
                        onClick={() => setShowSettings(false)}
                        class="text-[9px] font-mono uppercase px-3 py-2 text-gray-400 hover:text-gray-900">
                        {t.cancel}
                      </button>
                      <button 
                        type="submit" 
                        class="bg-[#2563EB] text-white text-[9px] font-mono uppercase px-4 py-2 hover:bg-blue-700 transition-colors">
                        {t.saveBtn}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
